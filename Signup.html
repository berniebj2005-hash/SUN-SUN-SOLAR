<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sun Son Solar - Sign Up</title>
  <link rel="stylesheet" href="stylev2.css">
</head>
<body>

  <form id="signupForm" class="signup-form" onsubmit="showSuccess(event)">
    <h2>☀️ Sun Son Solar</h2>

    
    <div id="step1">
      <label>First Name</label>
      <input type="text" name="first_name" placeholder="Enter first name" required>

      <label>Middle Name</label>
      <input type="text" name="middle_name" placeholder="Enter middle name">

      <label>Last Name</label>
      <input type="text" name="last_name" placeholder="Enter last name" required>

      <label>BirthDate</label>
      <input type="date" name="birthdate" required>

      <label>Gender</label>
      <input type="text" name="gender" placeholder="e.g. Male / Female" required>

      <label>Email</label>
      <input type="email" name="email" placeholder="e.g. name@sunsonsolar.com" required>

      <label>Phone Number</label>
      <input type="number" name="phone" placeholder="e.g. 09291230983" required>

      <label>Address</label>
      <input type="text" name="address" placeholder="Enter complete address" required>

      <button type="button" onclick="goNext()">Continue</button>
    </div>

    
    <div id="step2" style="display: none;">
      <label>Username</label>
      <input type="text" name="username" placeholder="Choose a username" required>

      <label>Password</label>
      <input type="password" name="password" placeholder="Create a password" required>

      <button type="submit">Create Account</button>
    </div>

    
    <div id="step3" style="display: none; text-align: center;">
      <p style="color: #27ae60; font-weight: bold; margin-top: 15px; font-size: 16px;">
        Account Created Successfully!
      </p>
      <a href="registration.html">Go back to Login Page</a>
    </div>

  </form>

  <script>
    function goNext() {
      const step1Inputs = document.querySelectorAll('#step1 input[required]');
      let allValid = true;

      step1Inputs.forEach(input => {
        if (!input.reportValidity()) {
          allValid = false;
        }
      });

      if (allValid) {
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
      }
    }

    function showSuccess(e) {
      e.preventDefault(); 
      document.getElementById('step2').style.display = 'none';
      document.getElementById('step3').style.display = 'block';
    }
  </script>

</body>
</html>
